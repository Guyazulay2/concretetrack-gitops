# האפליקציה עצמה (backend + frontend) מתוך ה-Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: concretetrack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Guyazulay2/concretetrack-gitops.git
    targetRevision: master
    path: charts/concretetrack
    helm:
      releaseName: concretetrack   # אותו שם כמו ה-release הקיים
      valueFiles:
        - ../../apps/concretetrack/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: concretetrack
  # ה-HPA קובע את מספר הרפליקות - לא לריב איתו
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true      # משאב שנמחק מ-git יימחק מהקלאסטר
      selfHeal: true   # שינוי ידני בקלאסטר יוחזר למה שב-git
    syncOptions:
      - RespectIgnoreDifferences=true
