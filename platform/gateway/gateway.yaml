apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: concretetrack-ca
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/duration: 2160h       # 90 יום - כמו Let's Encrypt
    cert-manager.io/renew-before: 360h    # חידוש 15 יום לפני פקיעה
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same          # רק ה-redirect שלמטה
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.192-168-1-240.sslip.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-sslip-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
---
# HTTP -> HTTPS (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: gateway
spec:
  parentRefs:
    - name: main
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
