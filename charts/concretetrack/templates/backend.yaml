{{- $name := "concretetrack-backend" -}}
{{- $sel := dict "app.kubernetes.io/name" $name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "ct.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.backend.config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- toYaml $sel | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
      annotations:
        # שינוי ב-ConfigMap -> פריסה מחדש אוטומטית
        checksum/config: {{ toYaml .Values.backend.config | sha256sum }}
    spec:
      {{- include "ct.podSecurity" . | nindent 6 }}
        runAsUser: 10001
        runAsGroup: 10001
      imagePullSecrets: [{name: {{ .Values.image.pullSecret }}}]
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- toYaml $sel | nindent 14 }}
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/concretetrack-backend:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.database.credentialsSecret }}, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.database.credentialsSecret }}, key: password}}
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@{{ .Values.database.cluster }}-rw:5432/{{ .Values.database.name }}?ssl=require"
          envFrom:
            - configMapRef: {name: {{ $name }}}
            - secretRef: {name: {{ .Values.backend.secretName }}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- include "ct.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector: {{- toYaml $sel | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "ct.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ .Values.backend.autoscaling.min }}
  maxReplicas: {{ .Values.backend.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.cpu }}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "ct.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- toYaml $sel | nindent 6 }}
