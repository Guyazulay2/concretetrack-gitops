apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: concretetrack
  labels: {{- include "ct.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # /api -> backend (רק /api! /metrics ו-/docs לא נחשפים החוצה)
    - matches:
        - path: {type: PathPrefix, value: /api}
      timeouts:
        request: 120s          # העלאת סרטונים
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=31536000"}
      backendRefs:
        - {name: concretetrack-backend, port: 80}
    # כל השאר -> frontend
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: "max-age=31536000"}
      backendRefs:
        - {name: concretetrack-frontend, port: 80}
